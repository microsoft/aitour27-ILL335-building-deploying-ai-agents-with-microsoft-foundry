<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320" role="img" aria-labelledby="title description">
  <title id="title">Caldova sentiment analysis and governed routing</title>
  <desc id="description">Lab 4 sends consumer feedback to a Foundry model through the Responses API. The local Python application parses output_text as JSON. Invalid JSON produces review_category NONE and confidence 0.0; a content filter block produces CONTENT_SAFETY and confidence 0.0. Local routing first escalates any category other than NONE, then sends confidence below 0.8 for review, otherwise returning the dashboard action. Sentiment does not determine routing. Actions are returned labels, not implemented queue or dashboard integrations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#526477"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; text-anchor: middle; font-size: 20px; }
      .heading { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #526477; }
      .label { font-size: 17px; fill: #526477; }
      .strong { font-weight: 600; }
      .action { font-family: Consolas, monospace; font-size: 18px; font-weight: 700; }
      .local { fill: #eaf4ff; stroke: #1976c9; stroke-width: 2; }
      .cloud { fill: #f1edff; stroke: #7955bd; stroke-width: 2; }
      .fallback { fill: #fff5d6; stroke: #b77a11; stroke-width: 2; }
      .review { fill: #fff0ee; stroke: #ca5148; stroke-width: 2; }
      .dashboard { fill: #e8f6ee; stroke: #218557; stroke-width: 2; }
      .decision { fill: #fff; stroke: #526477; stroke-width: 2; }
      .edge { fill: none; stroke: #526477; stroke-width: 2; marker-end: url(#arrow); }
      .exception { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1440" height="1320" fill="#fff"/>
  <text x="720" y="45" class="heading">Caldova sentiment analysis and governed routing</text>
  <text x="720" y="76" class="subtitle">Lab 4: cloud model analysis, local JSON parsing and deterministic routing</text>

  <rect x="520" y="110" width="400" height="64" rx="10" class="local"/>
  <text x="720" y="150" class="strong">Consumer feedback</text>
  <path d="M720 174 V210" class="edge"/>
  <rect x="520" y="210" width="400" height="110" rx="10" class="local"/>
  <text x="720" y="240" class="strong">Local Python application</text>
  <text x="720" y="271">SYSTEM_PROMPT + feedback</text>
  <text x="720" y="299" class="label">DefaultAzureCredential</text>

  <rect x="1050" y="135" width="370" height="210" rx="12" fill="#f8f6fc" stroke="#c7b9df"/>
  <text x="1235" y="164" class="label">CLOUD: Microsoft Foundry</text>
  <text x="1235" y="190" class="label">Project-connected model deployment</text>
  <rect x="1080" y="210" width="310" height="110" rx="10" class="cloud"/>
  <text x="1235" y="244" class="strong">Responses API</text>
  <text x="1235" y="275" class="strong">gpt-5.4-mini</text>
  <text x="1235" y="303" class="label">Prompt-based JSON</text>
  <path d="M920 240 H1080" class="edge"/>
  <text x="994" y="228" class="label">responses.create</text>

  <path d="M1080 290 H970 V460 H920" class="edge"/>
  <text x="853" y="369" class="label">response.output_text</text>
  <text x="720" y="398" class="label">LOCAL: parse the returned text</text>
  <rect x="520" y="415" width="400" height="112" rx="10" class="local"/>
  <text x="720" y="444" class="strong">Parse JSON: json.loads()</text>
  <text x="720" y="473">sentiment, confidence, topics,</text>
  <text x="720" y="502">review_category, summary</text>

  <path d="M520 460 H400" class="edge exception"/>
  <text x="460" y="427" class="label">Invalid</text>
  <text x="460" y="448" class="label">JSON</text>
  <rect x="50" y="415" width="350" height="112" rx="10" class="fallback"/>
  <text x="225" y="445" class="strong">Local non-JSON fallback</text>
  <text x="225" y="477">review_category: NONE</text>
  <text x="225" y="506">confidence: 0.0</text>

  <path d="M1235 320 V415" class="edge exception"/>
  <rect x="1147" y="361" width="176" height="25" fill="#fff"/>
  <text x="1235" y="379" class="label">Content filter block</text>
  <rect x="1050" y="415" width="370" height="112" rx="10" class="fallback"/>
  <text x="1235" y="445" class="strong">Local content-safety fallback</text>
  <text x="1235" y="477">review_category: CONTENT_SAFETY</text>
  <text x="1235" y="506">confidence: 0.0</text>

  <path d="M720 527 V630" class="edge"/>
  <text x="797" y="556" class="label">Parsed result</text>
  <path d="M225 527 V595 H720" class="edge"/>
  <path d="M1235 527 V595 H720" class="edge"/>
  <circle cx="720" cy="595" r="4" fill="#526477"/>
  <text x="332" y="622" class="label">LOCAL: route_feedback()</text>
  <polygon points="720,630 930,720 720,810 510,720" class="decision"/>
  <text x="720" y="712" class="strong">review_category</text>
  <text x="720" y="742" class="strong">!= NONE?</text>

  <path d="M510 720 H450" class="edge"/>
  <text x="478" y="705" class="label">Yes</text>
  <rect x="50" y="665" width="400" height="112" rx="10" class="review"/>
  <text x="250" y="700" class="action">ESCALATE_FOR_REVIEW</text>
  <text x="250" y="732">Regulated or content-safety review</text>
  <text x="250" y="758" class="label">Regardless of sentiment or confidence</text>

  <path d="M720 810 V850" class="edge"/>
  <text x="746" y="835" class="label">No</text>
  <polygon points="720,850 930,940 720,1030 510,940" class="decision"/>
  <text x="720" y="932" class="strong">confidence</text>
  <text x="720" y="962" class="strong">&lt; 0.8?</text>
  <path d="M930 940 H1000" class="edge"/>
  <text x="961" y="925" class="label">Yes</text>
  <rect x="1000" y="884" width="400" height="112" rx="10" class="review"/>
  <text x="1200" y="921" class="action">REVIEW_LOW_CONFIDENCE</text>
  <text x="1200" y="952">Human second look</text>
  <text x="1200" y="980" class="label">Includes the non-JSON fallback</text>

  <path d="M720 1030 V1090" class="edge"/>
  <text x="821" y="1065" class="label">No: confidence &gt;= 0.8</text>
  <rect x="520" y="1090" width="400" height="112" rx="10" class="dashboard"/>
  <text x="720" y="1127" class="action">ADD_TO_SENTIMENT_DASHBOARD</text>
  <text x="720" y="1158">Eligible for trend reporting</text>
  <text x="720" y="1186" class="label">review_category: NONE</text>

  <path d="M50 1232 H1390" stroke="#dce3ec"/>
  <text x="720" y="1263" class="strong">Sentiment classification is independent of routing.</text>
  <text x="720" y="1293" class="subtitle">The script returns and prints action labels; it does not implement review queues or a dashboard. Other API errors are re-raised.</text>
</svg>
